<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 376 348" role="img" aria-labelledby="title desc">
  <title id="title">캠페인 시청자 이동 동선 예시</title>
  <desc id="desc">서울 도심 지도 위에 출발점과 도착점, 이동 경로가 표시된 정적 이미지</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#171719" flood-opacity=".18"/>
    </filter>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dceeff"/>
      <stop offset="1" stop-color="#c7e1fb"/>
    </linearGradient>
  </defs>
  <!-- 외부 지도 서비스 없이 재현한 정적 지도 배경입니다. -->
  <rect width="376" height="348" fill="#f3f4f6"/>
  <path d="M-20 278C76 231 137 253 209 234c73-20 113-76 187-67v181H-20Z" fill="url(#water)"/>
  <g fill="#e4eadf" stroke="#d1d8cb" stroke-width="1">
    <path d="M12 18h62v50H12zM98 10h78v47H98zM202 18h67v64h-67zM292 8h72v56h-72z"/>
    <path d="M20 91h48v58H20zM91 78h82v67H91zM204 104h54v58h-54zM283 88h70v70h-70z"/>
    <path d="M9 177h76v55H9zM110 165h64v58h-64zM207 181h72v45h-72zM307 177h56v49h-56z"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M-10 76C66 92 113 71 182 81s129 8 205-23" stroke="#fff" stroke-width="18"/>
    <path d="M-10 76C66 92 113 71 182 81s129 8 205-23" stroke="#d8dadd" stroke-width="2"/>
    <path d="M70-10c8 67 3 126 19 183 11 40 30 86 38 185" stroke="#fff" stroke-width="16"/>
    <path d="M70-10c8 67 3 126 19 183 11 40 30 86 38 185" stroke="#d8dadd" stroke-width="2"/>
    <path d="M278-8c-6 71-21 121-10 181 8 43 34 86 38 185" stroke="#fff" stroke-width="14"/>
    <path d="M278-8c-6 71-21 121-10 181 8 43 34 86 38 185" stroke="#d8dadd" stroke-width="2"/>
    <path d="M-5 160c84 8 130-10 190 6 61 16 112 12 198-8" stroke="#fff" stroke-width="12"/>
    <path d="M-5 160c84 8 130-10 190 6 61 16 112 12 198-8" stroke="#d8dadd" stroke-width="2"/>
  </g>
  <g fill="#a0a4aa" font-family="Arial, sans-serif" font-size="9">
    <text x="22" y="41">시청광장</text><text x="117" y="36">도심공원</text>
    <text x="213" y="48">문화거리</text><text x="301" y="37">비즈니스센터</text>
    <text x="19" y="119">서초대로</text><text x="296" y="121">강남대로</text>
    <text x="30" y="204">상업지구</text><text x="222" y="207">복합문화공간</text>
  </g>
  <!-- 이동 동선과 주요 지점은 확대에도 선명한 벡터로 유지합니다. -->
  <path d="M76 244C94 222 105 198 122 183c24-22 44-15 57-33 18-25 16-56 46-62 26-5 52 17 63 45 10 27 5 55 25 75" fill="none" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".15"/>
  <path d="M76 244C94 222 105 198 122 183c24-22 44-15 57-33 18-25 16-56 46-62 26-5 52 17 63 45 10 27 5 55 25 75" fill="none" stroke="#3478f6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/>
  <g filter="url(#shadow)">
    <circle cx="76" cy="244" r="10" fill="#fff"/><circle cx="76" cy="244" r="6" fill="#3478f6"/>
    <circle cx="313" cy="208" r="10" fill="#fff"/><circle cx="313" cy="208" r="6" fill="#3478f6"/>
    <path d="M213 105c0-13 10-23 23-23s23 10 23 23c0 18-23 38-23 38s-23-20-23-38Z" fill="#3478f6"/>
    <circle cx="236" cy="105" r="8" fill="#fff"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="160" y="26" width="145" height="44" rx="10" fill="#fff"/>
    <text x="173" y="45" fill="#70737c" font-family="Arial, sans-serif" font-size="10">최근 이동 동선</text>
    <text x="173" y="61" fill="#171719" font-family="Arial, sans-serif" font-size="12" font-weight="700">시청 지점에서 1.2km 이동</text>
  </g>
  <rect x="12" y="302" width="118" height="32" rx="16" fill="#fff" opacity=".94" filter="url(#shadow)"/>
  <text x="28" y="322" fill="#46474c" font-family="Arial, sans-serif" font-size="11">정적 동선 미리보기</text>
</svg>
